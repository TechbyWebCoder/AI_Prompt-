<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Transitions</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: #222;
      padding: 10px;
      text-align: center;
      z-index: 10;
    }

    nav button {
      margin: 0 10px;
      padding: 10px 20px;
      color: white;
      background: #444;
      border: none;
      cursor: pointer;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      color: white;
      transform: translateX(100%);
      opacity: 0;
      transition: all 0.6s ease;
    }

    .page.active {
      transform: translateX(0);
      opacity: 1;
      z-index: 2;
    }

    .page.exit-left {
      transform: translateX(-100%);
      opacity: 0;
      z-index: 1;
    }

    #home { background: #3498db; }
    #about { background: #e74c3c; }
    #contact { background: #2ecc71; }
  </style>
</head>
<body>

  <nav>
    <button onclick="navigate('home')">Home</button>
    <button onclick="navigate('about')">About</button>
    <button onclick="navigate('contact')">Contact</button>
  </nav>

  <div class="container">
    <div id="home" class="page active">Home Page</div>
    <div id="about" class="page">About Page</div>
    <div id="contact" class="page">Contact Page</div>
  </div>

  <script>
    let currentPage = document.querySelector('.page.active');

    function navigate(pageId) {
      const nextPage = document.getElementById(pageId);

      if (nextPage === currentPage) return;

      // Animate current page out
      currentPage.classList.remove('active');
      currentPage.classList.add('exit-left');

      // Prepare next page
      nextPage.classList.remove('exit-left');
      nextPage.classList.add('active');

      // Reset old page after animation
      setTimeout(() => {
        currentPage.classList.remove('exit-left');
      }, 600);

      currentPage = nextPage;
    }
  </script>

</body>
</html>
